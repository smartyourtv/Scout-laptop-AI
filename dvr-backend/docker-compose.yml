services:
  traccar:
    image: traccar/traccar:latest
    container_name: scout-traccar
    restart: unless-stopped
    ports:
      - "8082:8082"
      - "5055:5055"
      - "7017:7017"
    volumes:
      - ./traccar.xml:/opt/traccar/conf/traccar.xml:ro
      - traccar-data:/data
    environment:
      - CONFIG_USE_ENVIRONMENT_VARIABLES=false

  frigate:
    image: ghcr.io/blakeblackshear/frigate:stable
    container_name: scout-frigate
    restart: unless-stopped
    privileged: true
    shm_size: "128mb"
    ports:
      - "5000:5000"
      - "8554:8554"
      - "8555:8555/tcp"
      - "8555:8555/udp"
    volumes:
      - ./frigate-config:/config
      - frigate-media:/media/frigate
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    environment:
      - FRIGATE_RTSP_PASSWORD=placeholder-set-on-laptop

volumes:
  traccar-data:
  frigate-media:
