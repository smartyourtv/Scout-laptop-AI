# Frigate config generated by traccar_frigate.py (Phase C).
# Phase 1 proof uses ONE test stream only. Real DVR cameras are added
# ONLY after streams are proven to exist (RTSP output is UNVERIFIED
# for the JOINLGO class — see DVR-BACKEND-TEST-PLAN.md).
mqtt:
  enabled: false

detectors:
  cpu1:
    type: cpu

cameras:
  test_stream:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/test_stream_PLACEHOLDER
          roles: [detect, record]
    detect:
      width: 1280
      height: 720
      fps: 5

record:
  enabled: true
  retain:
    days: 2

snapshots:
  enabled: true
